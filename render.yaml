services:
  - type: web
    runtime: static
    name: furnitar
    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: web/dist
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Permissions-Policy
        value: xr-spatial-tracking=(self), camera=(self)
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
